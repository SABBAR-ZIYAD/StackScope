[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-ecosystem-miner"
version = "1.0.0"
description = "Reproducible collection and mining of GitHub technology ecosystems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "duckdb>=1.1",
  "pandas>=2.1",
  "mlxtend>=0.23",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "networkx>=3.2",
]

[project.scripts]
gem = "github_ecosystem_miner.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.17"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["github_ecosystem_miner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
